name: Threatbase — Update Threat Intelligence Feed

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  # ── Manual: trigger from the Actions tab any time ─────────────────────────
  workflow_dispatch:

# Prevent concurrent runs from racing on the same git push.
# A new run queued while one is already active will wait, not cancel.
concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update-feed:
    name: Fetch, Aggregate & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Optimized script completes in ~90s; 10min buffer for slow networks

    # Required so the built-in GITHUB_TOKEN can push commits back to the repo.
    # No PAT or extra secrets are needed.
    permissions:
      contents: write

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Ensure we have the full history for accurate diff detection and rebasing
          fetch-depth: 0
          # No LFS objects exist any more: the large feeds ship as release assets and
          # their chunks are ordinary git objects. Enabling LFS here would only bill
          # the LFS bandwidth quota for fetching historical blobs on every run.
          lfs: false

      # ── 2. Python setup ──────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. Install dependencies ──────────────────────────────────────────────
      - name: Install Python dependencies
        run: pip install --quiet --no-cache-dir -r requirements.txt

      # ── 4. Process Uploaded ZIPs (MalwareBazaar) ─────────────────────────────
      - name: Extract Hashes from ZIPs
        run: |
          for zip in *.zip; do
            if [ -f "$zip" ]; then
              echo "Extracting hashes from $zip..."
              echo "" >> custom_iocs.txt
              echo "[hashes]" >> custom_iocs.txt
              echo "# Extracted from $zip on $(date -u)" >> custom_iocs.txt
              unzip -p "$zip" | grep -oE '\b([a-fA-F0-9]{32}|[a-fA-F0-9]{40}|[a-fA-F0-9]{64})\b' | tr '[:upper:]' '[:lower:]' | sort -u >> custom_iocs.txt
              git rm "$zip" || rm "$zip"
            fi
          done

      # ── 5. Restore the accumulative feed database ─────────────────────────────
      #
      # update_feed.py is accumulative: it seeds each run from the PREVIOUS contents
      # of ioc/*.txt (see load_previous_list). Steady state is that the committed
      # threatbase-domain-NN.txt chunks are already in the checkout and
      # load_previous_list_chunked() reassembles them with no download at all.
      #
      # The release download below is the migration path and the safety net: until
      # the first post-chunking run has committed a set of chunks, there is nothing
      # in the checkout to seed from. This matters a great deal, because
      # load_previous_list() returns an empty set for a missing file WITHOUT raising —
      # so seeding from nothing would not fail the build, it would silently republish
      # a feed shrunk to only today's source hits and then overwrite the `latest`
      # release with it. Failing loudly is deliberate.
      - name: Restore accumulative feed database (chunks, else `latest` release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p ioc

          for base in threatbase-domain threatbase-hash; do
            count=$(ls -1 ioc/${base}-[0-9][0-9].txt 2>/dev/null | wc -l)
            if [ "$count" -gt 0 ]; then
              lines=$(cat ioc/${base}-[0-9][0-9].txt | wc -l)
              echo "  ✓ ${base}: seeding from ${count} committed chunk(s), ${lines} lines"
              continue
            fi

            echo "No ${base} chunks committed yet — falling back to the 'latest' release."
            if ! gh release view latest >/dev/null 2>&1; then
              echo "::warning::No 'latest' release and no chunks for ${base}."
              echo "::warning::Treating this as a genuine first run; history starts from today."
              continue
            fi

            if ! gh release download latest --pattern "${base}.txt" --output "ioc/${base}.txt" --clobber; then
              echo "::error::Failed to download ${base}.txt from the 'latest' release."
              echo "::error::Refusing to continue — proceeding would silently truncate the feed."
              exit 1
            fi
            if [ ! -s "ioc/${base}.txt" ]; then
              echo "::error::Restored ioc/${base}.txt is empty. Refusing to continue."
              exit 1
            fi
            echo "  ✓ ${base}: restored $(wc -l < "ioc/${base}.txt") lines from the release"
          done

      # ── 6. Run the aggregator ────────────────────────────────────────────────
      - name: Run feed aggregator
        env:
          URLHAUS_AUTH_KEY: ${{ secrets.URLHAUS_AUTH_KEY }}
          ABUSEIPDB_API_KEY: ${{ secrets.ABUSEIPDB_API_KEY }}
          OTX_API_KEY: ${{ secrets.OTX_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python update_feed.py

      # ── 7. Commit and push ───────────────────────────────────────────────────
      #
      # Uses the official github-actions[bot] identity so commit history is clean.
      # The GITHUB_TOKEN has contents:write permission granted above.
      # GitHub itself prevents this push from re-triggering the same workflow,
      # so there is no risk of an infinite loop.
      - name: Commit and push updated feed files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage all generated output files: stats.json, manifest.json, history,
          # the category files, and the threatbase-domain-NN.txt / -hash-NN.txt
          # chunks. Only the two UNSPLIT feeds are excluded — they go out as release
          # assets instead. The explicit pathspec exclusions make that guarantee
          # independent of .gitignore, which would not apply if the files were ever
          # re-tracked by accident. Note these pathspecs are exact filenames, so they
          # do not match the -NN chunks, which is intended.
          git add ioc/
          git reset HEAD ioc/threatbase-domain.txt ioc/threatbase-hash.txt 2>/dev/null || true
          git add -f custom_iocs.txt 2>/dev/null || true

          # Check whether any staged file actually changed
          if git diff --staged --quiet; then
            echo "✓ No changes detected — feed is already up-to-date. Skipping commit."
          else
            # Get current counts from stats.json
            IP_COUNT=$(jq -r '.total_unique_ips' ioc/stats.json 2>/dev/null || echo "0")
            IPV6_COUNT=$(jq -r '.total_unique_ipv6' ioc/stats.json 2>/dev/null || echo "0")
            CIDR_COUNT=$(jq -r '.total_unique_cidrs' ioc/stats.json 2>/dev/null || echo "0")
            DOMAIN_COUNT=$(jq -r '.total_unique_domains' ioc/stats.json 2>/dev/null || echo "0")
            HASH_COUNT=$(jq -r '.total_unique_hashes' ioc/stats.json 2>/dev/null || echo "0")
            URL_COUNT=$(jq -r '.total_unique_urls' ioc/stats.json 2>/dev/null || echo "0")
            
            # Get previous counts from HEAD
            PREV_IP=$(git show HEAD:ioc/stats.json 2>/dev/null | jq -r '.total_unique_ips' 2>/dev/null || echo "0")
            PREV_IPV6=$(git show HEAD:ioc/stats.json 2>/dev/null | jq -r '.total_unique_ipv6' 2>/dev/null || echo "0")
            PREV_CIDR=$(git show HEAD:ioc/stats.json 2>/dev/null | jq -r '.total_unique_cidrs' 2>/dev/null || echo "0")
            PREV_DOMAIN=$(git show HEAD:ioc/stats.json 2>/dev/null | jq -r '.total_unique_domains' 2>/dev/null || echo "0")
            PREV_HASH=$(git show HEAD:ioc/stats.json 2>/dev/null | jq -r '.total_unique_hashes' 2>/dev/null || echo "0")
            PREV_URL=$(git show HEAD:ioc/stats.json 2>/dev/null | jq -r '.total_unique_urls' 2>/dev/null || echo "0")
            
            # Calculate deltas
            fmt_diff() {
              if [ "$1" -gt 0 ]; then echo "+$1"; else echo "$1"; fi
            }
            D_IP=$(fmt_diff $((IP_COUNT - PREV_IP)))
            D_IPV6=$(fmt_diff $((IPV6_COUNT - PREV_IPV6)))
            D_CIDR=$(fmt_diff $((CIDR_COUNT - PREV_CIDR)))
            D_DOMAIN=$(fmt_diff $((DOMAIN_COUNT - PREV_DOMAIN)))
            D_HASH=$(fmt_diff $((HASH_COUNT - PREV_HASH)))
            D_URL=$(fmt_diff $((URL_COUNT - PREV_URL)))

            # Format timestamp in Nepal Time (NPT/NTP)
            TIMESTAMP=$(TZ='Asia/Kathmandu' date '+%Y-%m-%d %I:%M %p NPT')
            
            git commit -m "Update: ${TIMESTAMP} — Added ${D_IP} IPs, ${D_IPV6} IPv6, ${D_CIDR} CIDRs, ${D_DOMAIN} Domains, ${D_HASH} Hashes, ${D_URL} URLs" -m "Total: ${IP_COUNT} IPs, ${IPV6_COUNT} IPv6, ${CIDR_COUNT} CIDRs, ${DOMAIN_COUNT} domains, ${HASH_COUNT} hashes, ${URL_COUNT} URLs"

            # Sync with any concurrent pushes, then push. Rebase prefers our freshly
            # generated files ('theirs' during a rebase = the commits being replayed).
            # The pull MUST live inside the `if`: this step runs under `bash -e`, so an
            # unguarded `git pull --rebase` that hits a conflict -X theirs can't resolve
            # (e.g. a chunk added/removed by a concurrent run) would abort the whole step.
            # `git rebase --abort` clears a half-finished rebase so the next try is clean.
            max_retries=5
            pushed=false
            for i in $(seq 1 $max_retries); do
              if git pull --rebase -X theirs --autostash --quiet origin "${GITHUB_REF_NAME:-main}" \
                 && git push origin "${GITHUB_REF_NAME:-main}"; then
                pushed=true
                echo "✓ Feed pushed successfully (${IP_COUNT} IPs, ${DOMAIN_COUNT} Domains, ${HASH_COUNT} Hashes, ${URL_COUNT} URLs)."
                break
              fi
              git rebase --abort 2>/dev/null || true
              echo "Push failed, retrying ($i/$max_retries) in a few seconds..."
              sleep $((RANDOM % 5 + 5))
            done

            if [ "$pushed" != true ]; then
              echo "::error::Could not push after ${max_retries} attempts."
              exit 1
            fi
          fi

      # ── 8. Create Daily Archive Release ───────────────────────────────────────
      #
      # Releases carry the UNSPLIT feeds. The committed -NN chunks are deliberately
      # excluded: they are byte-identical to the unsplit files when concatenated, so
      # shipping both would double every release to ~320 MB for no benefit. Hence the
      # explicit file list rather than a threatbase-*.txt glob, which would match the
      # chunks too.
      - name: Set Archive Date & Prepare Zip
        run: |
          set -euo pipefail
          DATE_DASH=$(date -u +'%Y-%m-%d')
          DATE_DOT=$(date -u +'%Y.%m.%d')
          echo "ARCHIVE_DATE=${DATE_DASH}" >> $GITHUB_ENV
          zip -j threatbase-archive-${DATE_DOT}.zip \
            ioc/threatbase-ip.txt \
            ioc/threatbase-ipv6.txt \
            ioc/threatbase-cidr.txt \
            ioc/threatbase-domain.txt \
            ioc/threatbase-hash.txt \
            ioc/threatbase-url.txt

      - name: Create Daily Archive Release
        uses: ncipollo/release-action@v1
        with:
          tag: archive-${{ env.ARCHIVE_DATE }}
          name: Daily Feed Archive - ${{ env.ARCHIVE_DATE }}
          artifacts: >-
            ioc/threatbase-ip.txt,ioc/threatbase-ipv6.txt,ioc/threatbase-cidr.txt,ioc/threatbase-domain.txt,ioc/threatbase-hash.txt,ioc/threatbase-url.txt,ioc/threatbase-ip.json,ioc/stats.json,ioc/manifest.json,threatbase-archive-*.zip
          allowUpdates: true
          replacesArtifacts: true
          body: "Automated daily archive of the Threatbase threat intelligence database."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 9. Publish the rolling `latest` release ────────────────────────────────
      #
      # This is the canonical download location for the full, unsplit feeds. The tag
      # never changes, so consumer URLs stay valid:
      #
      #   https://github.com/kalidada18/threatbase/releases/download/latest/threatbase-domain.txt
      #
      # `replacesArtifacts` overwrites yesterday's assets in place, so this release
      # occupies a constant ~180 MB no matter how long the feed runs, and is billed
      # against neither the LFS storage nor bandwidth quota.
      #
      # The website no longer reads the big feeds from here — it binary-searches the
      # committed chunks over raw.githubusercontent.com instead, fetching only the one
      # chunk that can contain the query. These assets remain the recommended download
      # for anyone who just wants one whole file, and the -NN chunks are intentionally
      # not uploaded (see step 8).
      - name: Publish rolling `latest` release
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Latest Feed
          artifacts: >-
            ioc/threatbase-ip.txt,ioc/threatbase-ipv6.txt,ioc/threatbase-cidr.txt,ioc/threatbase-domain.txt,ioc/threatbase-hash.txt,ioc/threatbase-url.txt,ioc/threatbase-ip.json,ioc/stats.json,ioc/manifest.json
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          body: |
            Always-current Threatbase feeds. This release is overwritten on every
            run, so these URLs are stable and always serve the newest data.

            | Feed | URL |
            |---|---|
            | Domains | `https://github.com/kalidada18/threatbase/releases/download/latest/threatbase-domain.txt` |
            | Hashes | `https://github.com/kalidada18/threatbase/releases/download/latest/threatbase-hash.txt` |
            | IPs | `https://github.com/kalidada18/threatbase/releases/download/latest/threatbase-ip.txt` |
            | URLs | `https://github.com/kalidada18/threatbase/releases/download/latest/threatbase-url.txt` |

            The domain and hash feeds are too large for a single file in git, so the
            repository also carries them split into ~45 MiB chunks under `ioc/`
            (`threatbase-domain-01.txt`, `-02.txt`, …). Concatenating the chunks in
            order reproduces the file above byte for byte. Read `manifest.json` for
            the current chunk list and each chunk's key range — the number of chunks
            grows with the feed, so please don't hardcode it.

            For a point-in-time snapshot, use the dated `archive-YYYY-MM-DD` releases.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


