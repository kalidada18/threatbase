name: Threatbase — Update Threat Intelligence Feed

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  # ── Manual: trigger from the Actions tab any time ─────────────────────────
  workflow_dispatch:

# Prevent concurrent runs from racing on the same git push.
# A new run queued while one is already active will wait, not cancel.
concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update-feed:
    name: Fetch, Aggregate & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Optimized script completes in ~90s; 10min buffer for slow networks

    # Required so the built-in GITHUB_TOKEN can push commits back to the repo.
    # No PAT or extra secrets are needed.
    permissions:
      contents: write

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Ensure we have the full history for accurate diff detection and rebasing
          fetch-depth: 0
          # Large feed files (domain/hash) are stored via Git LFS
          lfs: true

      # ── 2. Python setup ──────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. Install dependencies ──────────────────────────────────────────────
      - name: Install Python dependencies
        run: pip install --quiet --no-cache-dir -r requirements.txt

      # ── 4. Process Uploaded ZIPs (MalwareBazaar) ─────────────────────────────
      - name: Extract Hashes from ZIPs
        run: |
          for zip in *.zip; do
            if [ -f "$zip" ]; then
              echo "Extracting hashes from $zip..."
              echo "" >> custom_iocs.txt
              echo "[hashes]" >> custom_iocs.txt
              echo "# Extracted from $zip on $(date -u)" >> custom_iocs.txt
              unzip -p "$zip" | grep -oE '\b([a-fA-F0-9]{32}|[a-fA-F0-9]{40}|[a-fA-F0-9]{64})\b' | tr '[:upper:]' '[:lower:]' | sort -u >> custom_iocs.txt
              git rm "$zip" || rm "$zip"
            fi
          done

      # ── 5. Run the aggregator ────────────────────────────────────────────────
      - name: Run feed aggregator
        env:
          URLHAUS_AUTH_KEY: ${{ secrets.URLHAUS_AUTH_KEY }}
          ABUSEIPDB_API_KEY: ${{ secrets.ABUSEIPDB_API_KEY }}
          OTX_API_KEY: ${{ secrets.OTX_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python update_feed.py

      # ── 6. Commit and push ───────────────────────────────────────────────────
      #
      # Uses the official github-actions[bot] identity so commit history is clean.
      # The GITHUB_TOKEN has contents:write permission granted above.
      # GitHub itself prevents this push from re-triggering the same workflow,
      # so there is no risk of an infinite loop.
      - name: Commit and push updated feed files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage all generated output files (including stats, history, and split chunks)
          git add ioc/
          git add -f custom_iocs.txt 2>/dev/null || true

          # Check whether any staged file actually changed
          if git diff --staged --quiet; then
            echo "✓ No changes detected — feed is already up-to-date. Skipping commit."
          else
            # Get current counts from stats.json
            IP_COUNT=$(jq -r '.total_unique_ips' ioc/stats.json 2>/dev/null || echo "0")
            IPV6_COUNT=$(jq -r '.total_unique_ipv6' ioc/stats.json 2>/dev/null || echo "0")
            CIDR_COUNT=$(jq -r '.total_unique_cidrs' ioc/stats.json 2>/dev/null || echo "0")
            DOMAIN_COUNT=$(jq -r '.total_unique_domains' ioc/stats.json 2>/dev/null || echo "0")
            HASH_COUNT=$(jq -r '.total_unique_hashes' ioc/stats.json 2>/dev/null || echo "0")
            URL_COUNT=$(jq -r '.total_unique_urls' ioc/stats.json 2>/dev/null || echo "0")
            
            # Get previous counts from HEAD
            PREV_IP=$(git show HEAD:ioc/stats.json 2>/dev/null | jq -r '.total_unique_ips' 2>/dev/null || echo "0")
            PREV_IPV6=$(git show HEAD:ioc/stats.json 2>/dev/null | jq -r '.total_unique_ipv6' 2>/dev/null || echo "0")
            PREV_CIDR=$(git show HEAD:ioc/stats.json 2>/dev/null | jq -r '.total_unique_cidrs' 2>/dev/null || echo "0")
            PREV_DOMAIN=$(git show HEAD:ioc/stats.json 2>/dev/null | jq -r '.total_unique_domains' 2>/dev/null || echo "0")
            PREV_HASH=$(git show HEAD:ioc/stats.json 2>/dev/null | jq -r '.total_unique_hashes' 2>/dev/null || echo "0")
            PREV_URL=$(git show HEAD:ioc/stats.json 2>/dev/null | jq -r '.total_unique_urls' 2>/dev/null || echo "0")
            
            # Calculate deltas
            fmt_diff() {
              if [ "$1" -gt 0 ]; then echo "+$1"; else echo "$1"; fi
            }
            D_IP=$(fmt_diff $((IP_COUNT - PREV_IP)))
            D_IPV6=$(fmt_diff $((IPV6_COUNT - PREV_IPV6)))
            D_CIDR=$(fmt_diff $((CIDR_COUNT - PREV_CIDR)))
            D_DOMAIN=$(fmt_diff $((DOMAIN_COUNT - PREV_DOMAIN)))
            D_HASH=$(fmt_diff $((HASH_COUNT - PREV_HASH)))
            D_URL=$(fmt_diff $((URL_COUNT - PREV_URL)))

            # Format timestamp in Nepal Time (NPT/NTP)
            TIMESTAMP=$(TZ='Asia/Kathmandu' date '+%Y-%m-%d %I:%M %p NPT')
            
            git commit -m "Update: ${TIMESTAMP} — Added ${D_IP} IPs, ${D_IPV6} IPv6, ${D_CIDR} CIDRs, ${D_DOMAIN} Domains, ${D_HASH} Hashes, ${D_URL} URLs" -m "Total: ${IP_COUNT} IPs, ${IPV6_COUNT} IPv6, ${CIDR_COUNT} CIDRs, ${DOMAIN_COUNT} domains, ${HASH_COUNT} hashes, ${URL_COUNT} URLs"

            # Pull with rebase, resolving conflicts by preferring our freshly generated files ('theirs' during rebase)
            # Retry pushing up to 5 times in case of concurrent pushes from other workflows
            max_retries=5
            for i in $(seq 1 $max_retries); do
              git pull --rebase -X theirs --autostash --quiet origin "${GITHUB_REF_NAME:-main}"
              if git push origin "${GITHUB_REF_NAME:-main}"; then
                echo "✓ Feed pushed successfully (${IP_COUNT} IPs, ${DOMAIN_COUNT} Domains, ${HASH_COUNT} Hashes, ${URL_COUNT} URLs)."
                break
              fi
              echo "Push failed, retrying ($i/$max_retries) in a few seconds..."
              sleep $((RANDOM % 5 + 5))
            done
          fi

      # ── 7. Create Daily Archive Release ───────────────────────────────────────
      - name: Set Archive Date & Prepare Zip
        run: |
          DATE_DASH=$(date -u +'%Y-%m-%d')
          DATE_DOT=$(date -u +'%Y.%m.%d')
          echo "ARCHIVE_DATE=${DATE_DASH}" >> $GITHUB_ENV
          zip -j threatbase-archive-${DATE_DOT}.zip ioc/threatbase-ip*.txt ioc/threatbase-ipv6*.txt ioc/threatbase-cidr*.txt ioc/threatbase-domain*.txt ioc/threatbase-hash*.txt ioc/threatbase-url*.txt

      - name: Create Daily Archive Release
        uses: ncipollo/release-action@v1
        with:
          tag: archive-${{ env.ARCHIVE_DATE }}
          name: Daily Feed Archive - ${{ env.ARCHIVE_DATE }}
          artifacts: "ioc/threatbase-*.txt,ioc/threatbase-ip.json,ioc/stats.json,threatbase-archive-*.zip"
          allowUpdates: true
          replacesArtifacts: true
          body: "Automated daily archive of the Threatbase threat intelligence database."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


