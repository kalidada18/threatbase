name: probe — does the origin pin clear the Cloudflare challenge?
# Throwaway. Runs the exact command that has been failing in update-feed step 7,
# on a real runner, with the pin applied. Delete once it has answered.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install --quiet --no-cache-dir -r pipeline/requirements.txt

      - name: Baseline — what a runner sees WITHOUT the pin
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONUNBUFFERED: '1'
        run: |
          echo "resolves to: $(getent hosts api.threatbase.qzz.io | head -2)"
          python pipeline/sync_community_reports.py && echo "UNEXPECTED: baseline passed"

      - name: Apply the pin
        uses: ./.github/actions/pin-supabase-origin
        with:
          supabase-url: ${{ secrets.SUPABASE_URL }}

      - name: The real test — the step that has been failing
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONUNBUFFERED: '1'
        run: |
          echo "now resolves to: $(getent hosts api.threatbase.qzz.io | head -2)"
          python pipeline/sync_community_reports.py
          echo "=== community_reports.json ==="
          head -c 400 ioc/data/community_reports.json || true
