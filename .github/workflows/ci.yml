name: CI

on:
  pull_request:
  push:
    branches: [main]

# Avoid piling up redundant runs on rapid pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Non-blocking for now: the project was never run through `tsc --noEmit`
      # (Vite/esbuild skips type-checking), so there was a pre-existing backlog of
      # type errors (framer-motion variants, recharts props, implicit-any in some
      # components). As of 2026-09-19 `npm run typecheck` reports zero errors
      # locally, so this flag is probably stale — kept only because a clean
      # `npm ci` can hoist dependency types differently than a mutated
      # node_modules, and a red pipeline over a cosmetic prop type is not worth
      # the surprise. Remove `continue-on-error` once it has been seen green from
      # a fresh install.
      - name: Typecheck
        run: npm run typecheck
        continue-on-error: true

      # Blocking, unlike the step above. This is the only gate that covers
      # functions/ — the session, cookie, CSRF-origin, lease and rate-limit code
      # — and `tsconfig.functions.json` already existed while nothing in CI ran
      # it, so it had quietly accumulated five errors. Strict, and green as of
      # 2026-09-19.
      - name: Typecheck (functions)
        run: npm run typecheck:functions

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
